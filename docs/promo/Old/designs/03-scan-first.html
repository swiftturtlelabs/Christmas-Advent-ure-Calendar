  width: 3.75in;
  height: 2.25in;
  overflow: hidden;
}
.qr-frame img {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
.url-break {
  display: block;
  line-height: 1.15;
}

.card {
  color: var(--snow);
  background: linear-gradient(135deg, var(--pine-950) 0%, var(--pine-800) 55%, #163d2f 100%);
}
.safe {
  position: absolute;
  top: 0.32in; right: 0.38in; bottom: 0.32in; left: 0.32in;
  display: grid;
  grid-template-columns: 1.12in 1fr;
  gap: 0.16in;
  align-items: center;
}
.qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 0.05in; }
.qr-frame {
  width: 1.1in; height: 1.1in; padding: 0.05in;
  background: var(--snow);
  border-radius: 0.04in;
}
.scan-label {
  font-size: 0.085in; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--gold);
}
.copy { display: flex; flex-direction: column; min-width: 0; justify-content: center; }
.brand {
  font-family: 'Mountains of Christmas', Georgia, serif;
  font-size: 0.29in; line-height: 0.95; margin-bottom: 0.08in;
}
.hook { font-size: 0.115in; font-weight: 500; line-height: 1.3; color: rgba(255,253,248,0.9); margin-bottom: 0.1in; }
.chips { display: flex; flex-wrap: wrap; gap: 0.04in; margin-bottom: 0.1in; }
.chip {
  font-size: 0.078in; font-weight: 600; color: var(--pine-950);
  background: var(--gold); padding: 0.025in 0.07in;
}
.url { font-size: 0.088in; font-weight: 600; color: var(--gold-soft); letter-spacing: -0.01em; }
