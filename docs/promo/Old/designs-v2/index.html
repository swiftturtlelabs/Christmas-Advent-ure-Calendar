<!doctype html><html lang="en"><head><meta charset="UTF-8" />
<title>Promo cards — round 2</title>
<style>
  body { font-family: Georgia, serif; background: #e8efe9; margin: 0; padding: 1.5rem; color: #172a22; }
  h1 { margin: 0 0 0.35rem; }
  .lead { margin: 0 0 1rem; color: #4d6358; max-width: 40rem; }
  .note { background: #fff8e6; border-left: 4px solid #f5c04c; padding: 0.75rem 1rem; margin-bottom: 1.25rem; max-width: 40rem; }
  .grid { display: grid; gap: 1.25rem; }
  figure { margin: 0; background: #fff; padding: 0.85rem; box-shadow: 0 8px 24px rgba(6,37,28,0.12); }
  img { display: block; width: 100%; max-width: 580px; height: auto; border: 1px solid #d5e0d8; }
  figcaption { margin-top: 0.55rem; }
  code { font-size: 0.85rem; background: #f3f7f4; padding: 0.1rem 0.35rem; }
</style></head><body>
<h1>Round 2 — your hybrid picks</h1>
<p class="lead">Scan-first layout + ribbon top + light site look + gold + soft 24. URL reads <strong>ChristmasAdventureCalendar.com</strong>.</p>
<div class="note">All PDFs: 3.75″ × 2.25″ with 0.125″ bleed. Trim to 3.5″ × 2″. Roomy insets so type stays off the cut.</div>
<div class="grid">
<figure>
  <img src="A-light-scan.png" alt="Light Scan" />
  <figcaption><strong>A. Light Scan</strong> — Scan-first layout on a cream panel, ribbon top, soft gold 24<br />
  Print file: <code>A-light-scan.pdf</code></figcaption>
</figure>
<figure>
  <img src="B-gold-glow.png" alt="Gold Glow" />
  <figcaption><strong>B. Gold Glow</strong> — Warmer gold light, stronger 24 watermark, gold “Scan me” badge<br />
  Print file: <code>B-gold-glow.pdf</code></figcaption>
</figure>
<figure>
  <img src="C-holly-title.png" alt="Holly Title" />
  <figcaption><strong>C. Holly Title</strong> — Site-style holly title, airy margins, quiet gold 24<br />
  Print file: <code>C-holly-title.pdf</code></figcaption>
</figure>
<figure>
  <img src="D-roomy-footer.png" alt="Roomy Footer" />
  <figcaption><strong>D. Roomy Footer</strong> — Most breathing room; large URL on a gold-tinted footer strip<br />
  Print file: <code>D-roomy-footer.pdf</code></figcaption>
</figure>
</div>
</body></html>
