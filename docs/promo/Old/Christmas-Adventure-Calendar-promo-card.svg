<?xml version="1.0" encoding="UTF-8"?>
<!--
  Christmas Advent-ure Calendar — promo card (print)
  Open in Adobe Illustrator → File → Save As → Adobe Illustrator (*.ai)

  Printer: trim 3.5" × 2" with 1/8" (0.125") bleed on all sides
  Artboard: 3.75" × 2.25"
  Fonts: Poppins Bold/Medium, Mountains of Christmas Bold
  QR encodes: https://christmasadventurecalendar.com/
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="3.75in"
  height="2.25in"
  viewBox="0 0 1125 675"
  xml:space="preserve"
>
  <title>Christmas Advent-ure Calendar promo card</title>
  <desc>Printable business card. Bleed artboard 3.75x2.25 in. Trim 3.5x2 in.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="35%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="55%" stop-color="#fbf6ea"/>
      <stop offset="100%" stop-color="#fff3d9"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="88%" cy="78%" r="42%">
      <stop offset="0%" stop-color="#f5c04c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f5c04c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowHolly" cx="10%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#d63b3b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#d63b3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b3d2e" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0b3d2e" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#f5c04c"/>
    </linearGradient>
    <pattern id="candyStripe" patternUnits="userSpaceOnUse" width="246" height="15">
      <rect width="246" height="15" fill="transparent"/>
      <rect x="0" y="0" width="15" height="15" fill="#d63b3b"/>
      <rect x="84" y="0" width="18" height="15" fill="#f5c04c"/>
      <rect x="165" y="0" width="15" height="15" fill="#22754f"/>
    </pattern>
  </defs>

  <!-- Layer: Background -->
  <g id="Background">
    <rect x="0" y="0" width="1125" height="675" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1125" height="675" fill="url(#glowGold)"/>
    <rect x="0" y="0" width="1125" height="675" fill="url(#glowHolly)"/>
  </g>

  <!-- Layer: Watermark 24 -->
  <g id="Watermark-24">
    <text
      x="1089"
      y="418.5"
      text-anchor="end"
      font-family="Mountains of Christmas, Georgia, serif"
      font-weight="700"
      font-size="525"
      fill="#f5c04c"
      fill-opacity="0.18"
    >24</text>
  </g>

  <!-- Layer: Header ribbon -->
  <g id="Header-Ribbon">
    <rect x="0" y="0" width="1125" height="108" fill="url(#ribbonGrad)"/>
    <rect x="0" y="108" width="1125" height="15" fill="url(#candyStripe)"/>
    <text
      x="562.5"
      y="70.5"
      text-anchor="middle"
      font-family="Poppins, Arial, sans-serif"
      font-weight="700"
      font-size="33"
      fill="#f5c04c"
    >ChristmasAdventureCalendar.com</text>
  </g>

  <!-- Layer: QR -->
  <g id="QR-Code" transform="translate(114, 174)">
    <rect
      x="0" y="0"
      width="324" height="324"
      fill="#fffdf8"
      stroke="#f5c04c"
      stroke-width="4.8"
    />
    <image
      xlink:href="data:image/png;base64,"
      x="14.4" y="14.4"
      width="295.2" height="295.2"
      preserveAspectRatio="xMidYMid meet"
    />
    <text
      x="162"
      y="360"
      text-anchor="middle"
      font-family="Poppins, Arial, sans-serif"
      font-weight="700"
      font-size="24.6"
      letter-spacing="0.12em"
      fill="#124a37"
    >SCAN ME</text>
  </g>

  <!-- Layer: Typography -->
  <g id="Typography" transform="translate(504, 168.00000000000003)">
    <text
      font-family="Mountains of Christmas, Georgia, serif"
      font-weight="700"
      font-size="82.5"
      fill="#0b3d2e"
    >
      <tspan x="0" dy="0">Christmas</tspan>
      <tspan x="0" dy="78">Advent-ure</tspan>
      <tspan x="0" dy="78">Calendar</tspan>
    </text>

    <!-- FOR FREE badge -->
    <g id="For-Free-Badge" transform="translate(0, 252)">
      <rect width="216" height="51.00000000000001" rx="3" fill="url(#chipGrad)"/>
      <text
        x="108" y="36"
        text-anchor="middle"
        font-family="Poppins, Arial, sans-serif"
        font-weight="700"
        font-size="25.500000000000004"
        letter-spacing="0.1em"
        fill="#06251c"
      >FOR FREE</text>
    </g>

    <text
      y="341.99999999999994"
      font-family="Poppins, Arial, sans-serif"
      font-weight="500"
      font-size="31.5"
      fill="#4d6358"
    >
      <tspan x="0" dy="0">A personalized Christmas</tspan>
      <tspan x="0" dy="40.5">adventure, one day at a time.</tspan>
    </text>

    <!-- Chips -->
    <g id="Feature-Chips" transform="translate(0, 426)">
      
    <g transform="translate(0, 0)">
      <rect width="155" height="28" rx="4" fill="url(#chipGrad)"/>
      <text
        x="12" y="19"
        font-family="Poppins, Arial, sans-serif"
        font-weight="600"
        font-size="14"
        fill="#06251c"
      >Daily surprises</text>
    </g>
      
    <g transform="translate(165, 0)">
      <rect width="145" height="28" rx="4" fill="url(#chipGrad)"/>
      <text
        x="12" y="19"
        font-family="Poppins, Arial, sans-serif"
        font-weight="600"
        font-size="14"
        fill="#06251c"
      >Secret riddles</text>
    </g>
      
    <g transform="translate(0, 42)">
      <rect width="310" height="28" rx="4" fill="url(#chipGrad)"/>
      <text
        x="12" y="19"
        font-family="Poppins, Arial, sans-serif"
        font-weight="600"
        font-size="14"
        fill="#06251c"
      >Printable QR codes for each day</text>
    </g>
    </g>
  </g>

  <!-- Layer: Trim guides (non-printing helpers — delete before final export if desired) -->
  <g id="Trim-Guides" opacity="0.35">
    <rect
      x="37.5" y="37.5"
      width="1050" height="600"
      fill="none"
      stroke="#00a0e3"
      stroke-width="1"
      stroke-dasharray="6 4"
    />
  </g>
</svg>
